name: "Agent Gate"
description: "On/off access gate for AI agents: MCP write lock, shell command tool, controlled add-ons, timed windows"
version: "0.5.8"
slug: "agent_gate"
url: "https://github.com/yaniv376/ha-agent-gate"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:9584]/healthz"
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - type: local_apps
    read_only: false
    path: /addons
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: share
    read_only: false
    path: /share
  - type: backup
    read_only: true
    path: /backup
ports:
  9584/tcp: 9584
ports_description:
  9584/tcp: "MCP gate endpoint. Point the Webhook Proxy's 'MCP server URL' at it (see add-on log for the private path)."
services:
  - mqtt:need
options:
  upstream_mcp_url: ""
  notify_service: "notify"
  reminder_minutes: 60
  deviation_grace_minutes: 5
  approval_timeout_minutes: 3
  backup_policy: "always"
  backup_skip_short: false
  language: "en"
  default_window_minutes: 30
  create_dashboard: true
  scan_interval_hours: 24
  read_tool_patterns:
    - "ha_get_*"
    - "ha_list_*"
    - "ha_search"
    - "ha_config_get_*"
    - "ha_config_list_*"
    - "ha_read_file"
    - "ha_eval_template"
    - "ha_get_skill_guide"
    - "ha_report_issue"
  protected_patterns:
    - "agent_gate"
  protected_exempt_tools:
    - "ha_config_set_dashboard"
    - "ha_config_set_dashboard_resource"
    - "ha_config_set_label"
    - "ha_config_set_category"
  destructive_patterns:
    - "\\brm\\b"
    - "\\brmdir\\b"
    - "\\bunlink\\b"
    - "\\bmv\\b"
    - "\\bshred\\b"
    - "\\bdd\\b"
    - "\\bmkfs"
    - "\\bchmod\\b"
    - "\\bchown\\b"
    - "\\btruncate\\b"
    - ">\\s*/"
    - "\\bdocker\\b"
    - "\\bha\\s+(core|host|supervisor|os)\\b"
    - "\\breboot\\b"
    - "\\bshutdown\\b"
    - "\\bkill"
    - "\\bgit\\s+(reset|clean|checkout\\s+--|push\\s+-f)"
  anomaly_enabled: true
  anomaly_writes_warn_per_min: 60
  anomaly_deletes_lock_per_min: 5
  redact_secrets: true
  redact_patterns: []
  canary_enabled: true
  canary_files:
    - "/homeassistant/secrets_backup.yaml"
    - "/share/agent_gate/credentials.txt"
  mechanisms:
    - key: "ssh"
      name: "SSH"
      default_on: true
      addons: ["a0d7b954_ssh"]
    - key: "claude_terminal"
      name: "Claude Terminal"
      default_on: true
      addons: ["e498daa1_claude_terminal"]
    - key: "file_editors"
      name: "File editors"
      default_on: true
      addons: ["a0d7b954_vscode", "core_configurator"]
    - key: "appdaemon"
      name: "AppDaemon"
      default_on: false
      addons: ["a0d7b954_appdaemon"]
schema:
  upstream_mcp_url: str
  notify_service: str?
  reminder_minutes: int(0,1440)?
  deviation_grace_minutes: int(1,60)?
  approval_timeout_minutes: int(1,30)?
  backup_policy: list(always|every_6h|daily|never)?
  backup_skip_short: bool?
  language: list(en|he)?
  default_window_minutes: int(1,1440)?
  create_dashboard: bool?
  scan_interval_hours: int(0,168)?
  read_tool_patterns:
    - str
  protected_patterns:
    - str?
  protected_exempt_tools:
    - str?
  destructive_patterns:
    - str?
  anomaly_enabled: bool?
  anomaly_writes_warn_per_min: int(0,1000)?
  anomaly_deletes_lock_per_min: int(0,100)?
  redact_secrets: bool?
  redact_patterns:
    - str?
  canary_enabled: bool?
  canary_files:
    - str?
  mechanisms:
    - key: str
      name: str
      default_on: bool?
      addons:
        - str?
