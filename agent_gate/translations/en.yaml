configuration:
  upstream_mcp_url:
    name: Upstream MCP server URL
    description: The private URL of your ha-mcp server (from the ha-mcp add-on log). The gate sits in front of it.
  notify_service:
    name: Notification service
    description: The notify service for your phone, e.g. mobile_app_my_phone. "notify" sends to all.
  reminder_minutes:
    name: Reminder every (minutes)
    description: While something is open, remind you this often. 0 disables. Also adjustable on the dashboard.
  deviation_grace_minutes:
    name: Deviation grace (minutes)
    description: An add-on running without an open window is stopped after this many minutes.
  approval_timeout_minutes:
    name: Approval timeout (minutes)
    description: A command waiting for your approval expires after this.
  backup_policy:
    name: Backup before opening
    description: "always: full backup before every open. every_6h / daily: only when the newest full backup (any source) is older than that. never: no backup. Also on the dashboard."
  backup_skip_short:
    name: No backup for short windows
    description: Skip the backup for windows of 15 minutes or less.
  language:
    name: Language
    description: Language of phone notifications (en or he).
  default_window_minutes:
    name: Default window (minutes)
    description: Used when a mechanism switch or the master switch is turned on without choosing a duration.
  create_dashboard:
    name: Create the Agent Gate dashboard
    description: On start, create a ready-made "Agent Gate" dashboard in the sidebar if one does not exist yet.
  scan_interval_hours:
    name: Security scan every (hours)
    description: Run the security scan on a schedule. 0 = only from the Scan now button. A scan also runs 90 s after every start.
  read_tool_patterns:
    name: Read-only tool patterns
    description: MCP tools matching these patterns are always allowed (they only read).
  protected_patterns:
    name: Protected patterns
    description: A tool call or command mentioning any of these is refused, even in an open window. Keeps the agent away from the gate itself.
  protected_exempt_tools:
    name: Tools exempt from protection
    description: Write tools that may mention the gate without acting on it (dashboards, labels).
  destructive_patterns:
    name: Destructive command patterns
    description: Shell commands matching these regular expressions need your approval on the phone before they run.
  anomaly_enabled:
    name: Behaviour monitor
    description: Watch the rate of write and delete tool calls in an open window. Many writes only warn; a burst of deletions, removals or stops locks every mechanism. Thresholds double in an "until I close" window.
  anomaly_writes_warn_per_min:
    name: Writes per minute that trigger a warning
    description: 0 disables the warning.
  anomaly_deletes_lock_per_min:
    name: Deletions per minute that lock the gate
    description: Counts remove/delete/purge/uninstall tools, add-on stops and delete-like service calls. 0 disables the lock.
  redact_secrets:
    name: Hide secrets from the agent
    description: Passwords, tokens, API keys and private keys in tool results and command output are replaced by a marker before they reach the agent.
  redact_patterns:
    name: Extra secret patterns
    description: Additional regular expressions (case-insensitive) whose matches are hidden as well.
  canary_enabled:
    name: Decoy files (honeypot)
    description: Plant decoy "secrets" files. Any tool call or command that touches one is refused, every mechanism closes at once, and you get a notification.
  canary_files:
    name: Decoy file paths
    description: Where to place the decoys. Use names that look valuable and that no real task needs.
  agent_files_write_dirs:
    name: Report files - write folders
    description: Folders where gate_agent_files may create or append report files (the Report files mechanism). Nothing outside them can be written.
  agent_files_read_dirs:
    name: Report files - read folders
    description: Folders gate_agent_files may list and read. The write folders are always readable too.
  agent_files_max_kb:
    name: Report files - size limit (KB)
    description: Largest file gate_agent_files may write.
  shell_hide_secrets:
    name: Hide credentials from the shell
    description: Before every command, make the paths below unreadable for gate_run_command. Home Assistant and other add-ons keep full access.
  shell_hidden_paths:
    name: Paths hidden from the shell
    description: Files or folders (glob patterns allowed) with credentials, for example .storage and secrets.yaml.
  mechanisms:
    name: Mechanisms
    description: Each entry is an access path the gate controls (key, display name, the add-ons it starts and stops, and whether a full window includes it).
